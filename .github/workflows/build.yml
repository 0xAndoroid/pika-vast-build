name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: pika repo ref to build
        default: vast-image

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk (CUDA image needs the space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: 0xAndoroid/pika
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PIKA_REPO_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 0xAndoroid
          password: ${{ secrets.PIKA_REPO_TOKEN }}

      - name: Resolve short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/vast-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/0xandoroid/pika-vast:latest
            ghcr.io/0xandoroid/pika-vast:${{ steps.sha.outputs.short }}
