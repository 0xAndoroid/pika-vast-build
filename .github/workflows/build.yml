name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: pika repo ref to build
        default: vast-image
  pull_request:
    paths:
      - .github/workflows/build.yml

permissions: {}

jobs:
  source-access:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check private image repository read access
        uses: actions/checkout@v4
        with:
          repository: 0xAndoroid/pika-config
          ref: main
          token: ${{ secrets.PIKA_REPO_TOKEN }}
          persist-credentials: false
          sparse-checkout: docker/vast-image

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk (CUDA image needs the space)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: 0xAndoroid/pika
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PIKA_REPO_TOKEN }}
          persist-credentials: false
          path: pika-source

      - name: Check out private image recipe
        uses: actions/checkout@v4
        with:
          repository: 0xAndoroid/pika-config
          ref: main
          token: ${{ secrets.PIKA_REPO_TOKEN }}
          persist-credentials: false
          sparse-checkout: docker/vast-image
          path: image-source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: 0xAndoroid
          password: ${{ secrets.PIKA_REPO_TOKEN }}

      - name: Resolve short sha
        id: sha
        working-directory: pika-source
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: pika-source
          file: image-source/docker/vast-image/Dockerfile
          build-contexts: image=./image-source/docker/vast-image
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/0xandoroid/pika-vast:latest
            ghcr.io/0xandoroid/pika-vast:${{ steps.sha.outputs.short }}
